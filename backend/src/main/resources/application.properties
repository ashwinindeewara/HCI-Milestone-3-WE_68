spring.application.name=backend
server.port=8083

# -------------------------------------------------------------
# NEON POSTGRESQL CLOUD CONFIGURATION
# -------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://ep-withered-block-b57jj0l2-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_89HvlqCVIKiZ
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP Connection Pool Optimization for Neon Cloud
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000

# HTTP Response Compression Optimization
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=512

# Tomcat Performance Optimization
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20