spring.application.name=backend
server.port=${PORT:${SERVER_PORT:8080}}

# -------------------------------------------------------------
# NEON POSTGRESQL SHARED CLOUD DATABASE CONFIGURATION
# NEON POSTGRESQL CLOUD CONFIGURATION (active)
# -------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-withered-block-b57jj0l2-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_89HvlqCVIKiZ}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings for Cloud Postgres Pooler
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=180000

# JPA & Hibernate Settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# File uploads (profile pictures are capped at 5 MB in ProfilePictureService)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

